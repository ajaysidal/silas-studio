events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    upstream silas_app {
        server silas-app:3000;
    }

    server {
        listen 80;
        server_name silas-studio.buildwithai.digital www.silas-studio.buildwithai.digital;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        server_name silas-studio.buildwithai.digital www.silas-studio.buildwithai.digital;

        ssl_certificate /etc/letsencrypt/live/silas-studio.buildwithai.digital/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/silas-studio.buildwithai.digital/privkey.pem;
        
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;

        location / {
            proxy_pass http://silas_app;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            proxy_cache off;
            proxy_buffering off;
            chunked_transfer_encoding on;
        }
    }
}
