services:
  silas-db:
    image: postgres:16-alpine
    container_name: silas-db
    restart: always
    network_mode: "host"
    environment:
      POSTGRES_USER: silas
      POSTGRES_PASSWORD: SilasSecurePass2026!
      POSTGRES_DB: silas_studio
    volumes:
      - silas_db_data:/var/lib/postgresql/data

  silas-app:
    build: .
    container_name: silas-app
    restart: always
    network_mode: "host"
    environment:
      # Now we can safely use localhost because of host networking
      DATABASE_URL: "postgresql://silas:SilasSecurePass2026!@127.0.0.1:5432/silas_studio?schema=public"
      NEXTAUTH_SECRET: "a-secure-random-32-character-string-for-silas-studio-2026"
      OLLAMA_BASE_URL: "http://127.0.0.1:11434"
      OLLAMA_MODEL: "llama3"
    depends_on:
      - silas-db

volumes:
  silas_db_data:
