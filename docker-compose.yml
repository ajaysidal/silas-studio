services:
  silas-db:
    image: postgres:16-alpine
    container_name: silas-db
    restart: always
    environment:
      POSTGRES_USER: silas
      POSTGRES_PASSWORD: SilasSecurePass2026!
      POSTGRES_DB: silas_studio
    volumes:
      - silas_db_data:/var/lib/postgresql/data
    networks:
      - silas-network
  silas-app:
    build: .
    container_name: silas-app
    restart: always
    ports:
      - "127.0.0.1:3000:3000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      DATABASE_URL: "postgresql://silas:SilasSecurePass2026!@silas-db:5432/silas_studio?schema=public"
      NEXTAUTH_SECRET: "a-secure-random-32-character-string-for-silas-studio-2026"
      OLLAMA_BASE_URL: "http://host.docker.internal:11434"
      OLLAMA_MODEL: "llama3"
    depends_on:
      - silas-db
    networks:
      - silas-network
volumes:
  silas_db_data:
networks:
  silas-network:
    driver: bridge
